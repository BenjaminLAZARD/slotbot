name: slotbot

# Local development on OrbStack (or any Docker engine).
#   docker compose up --build
#   UI  -> http://localhost:5173
#   API -> http://localhost:8000/docs
#   Debugger -> attach to localhost:5678 (VS Code/Cursor: "Attach to API (docker)")
# Both services hot-reload: edit backend/src or frontend/src and changes apply within ~5 s (polling, to keep CPU low).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: slotbot
      POSTGRES_PASSWORD: slotbot
      POSTGRES_DB: slotbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "slotbot"]
      interval: 2s
      retries: 20

  api:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      SLOTBOT_DATABASE_URL: postgresql+asyncpg://slotbot:slotbot@db:5432/slotbot
      SLOTBOT_GOOGLE_SERVICE_ACCOUNT: /secrets/google-service-account.json
      WATCHFILES_FORCE_POLLING: "true"  # bind-mounted files don't always emit change events
      WATCHFILES_POLL_DELAY_MS: "5000"  # default 300 ms costs noticeable CPU
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - ./secrets:/secrets:ro
    # debugpy listens without blocking startup; uvicorn restarts the worker on every change in src/.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec python -m debugpy --listen 0.0.0.0:5678 -m uvicorn slotbot.main:create_app --factory
        --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src
    ports:
      - "8000:8000"
      - "5678:5678"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /web
    environment:
      API_URL: http://api:8000
      VITE_USE_POLLING: "true"  # bind-mounted files don't always emit change events
    volumes:
      - ./frontend:/web
      - web_node_modules:/web/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
